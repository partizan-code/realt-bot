[project]
name = "realt-bot"
version = "0.1.0"
description = "Kufar rental listings monitor with Telegram notifications"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
